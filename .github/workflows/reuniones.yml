# Prepara cada semana los videos e imágenes de las reuniones para la app de Roku
# (el Roku no puede abrir las publicaciones JWPUB). El resultado queda en la rama "feed".
name: Reuniones de la semana
on:
  push:
    branches: [main]
    paths: ["feed-builder/**", ".github/workflows/reuniones.yml"]
  schedule:
    - cron: "17 4 * * 1,3,6"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar reuniones
        working-directory: feed-builder
        run: |
          npm install --no-audit --no-fund
          NODE_PATH=$PWD/shim node build.js ../_out
      - name: Publicar en la rama feed
        run: |
          cd _out
          git init -q -b feed
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Reuniones $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" feed
