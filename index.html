<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1116">
  <meta name="description" content="Videos, audios y la Biblia de jw.org (app personal, no oficial).">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Broadcasting">
  <title>Broadcasting Player</title>
  <link rel="stylesheet" href="style.css?v=1.8.0-mwxno8x4">
</head>
<body>
  <header id="topbar">
    <button id="back" class="icon-btn" hidden><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <div id="brand"><img src="assets/icon.png" alt=""><span id="brand-title">Broadcasting Player</span></div>
    <nav id="tabs">
      <button data-tab="home"><span></span></button>
      <button data-tab="explore"><span></span></button>
      <button data-tab="search"><span></span></button>
      <button data-tab="settings"><span></span></button>
    </nav>
    <div id="actions">
      <button id="lang-btn" class="pill"><svg viewBox="0 0 24 24"><path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg><span></span></button>
      <button id="theme-btn" class="icon-btn"></button>
      <button id="tv-btn" class="pill"><svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg><span></span></button>
      <button id="jworg-btn" class="pill"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg><span>JW.ORG</span></button>
    </div>
  </header>

  <main id="view"></main>

  <!-- Reproductor -->
  <section id="player" hidden>
    <div id="player-bar">
      <button id="player-close" class="icon-btn" title="Cerrar"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      <div id="player-title"></div>
      <button id="player-prev" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button id="player-next" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <button id="player-tv" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg></button>
      <button id="player-full" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
    </div>
    <div id="player-stage">
      <img id="player-art" alt="" hidden>
      <video id="video" controls autoplay></video>
      <div id="player-loading" hidden><div class="spinner"></div><p></p></div>
    </div>
  </section>

  <!-- Visor de imágenes -->
  <section id="viewer" hidden>
    <button id="viewer-close" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
    <div id="viewer-count"></div>
    <button id="viewer-fav" class="icon-btn"></button>
    <button id="viewer-prev" class="viewer-nav">‹</button>
    <img id="viewer-img" alt="">
    <button id="viewer-next" class="viewer-nav">›</button>
    <div id="viewer-caption"></div>
  </section>

  <div id="dialog-backdrop" hidden><div id="dialog"></div></div>
  <div id="toast" hidden></div>

  <script src="bp.js?v=1.8.0-mwxno8x4"></script>
  <script src="app.js?v=1.8.0-mwxno8x4"></script>
</body>
</html>
